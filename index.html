<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pagal Ninja - Swipe Arcade</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #160c07;
      font-family: 'Inter', sans-serif;
      color: #fff;
    }

    /* Dojo Wooden Wall Background */
    .dojo-bg {
      background:
        radial-gradient(circle at 20% 25%, rgba(255, 115, 0, 0.16) 0%, transparent 40%),
        radial-gradient(circle at 80% 25%, rgba(255, 115, 0, 0.16) 0%, transparent 40%),
        repeating-linear-gradient(
          90deg,
          #24130a 0px,
          #24130a 48px,
          #1c0e07 49px,
          #2b170c 52px
        );
    }

    .title-font {
      font-family: 'Bungee', cursive;
      letter-spacing: 1px;
    }

    /* Floating Lantern Glow Animation */
    @keyframes sway {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(-3deg); }
      50% { transform: translate3d(0, 4px, 0) rotate(3deg); }
    }

    .lantern {
      animation: sway 4s ease-in-out infinite;
      will-change: transform;
    }

    /* Screen Shake on Bomb Hit */
    @keyframes screenShake {
      0%, 100% { transform: translate3d(0, 0, 0); }
      20% { transform: translate3d(-10px, 6px, 0); }
      40% { transform: translate3d(10px, -6px, 0); }
      60% { transform: translate3d(-8px, -4px, 0); }
      80% { transform: translate3d(8px, 4px, 0); }
    }

    .shake {
      animation: screenShake 0.35s ease-in-out;
    }

    /* Custom 3D Button Styling */
    .btn-3d {
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-3d:active {
      transform: translateY(3px);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      will-change: transform;
      transform: translateZ(0);
    }
  </style>
</head>
<body class="dojo-bg h-screen w-screen overflow-hidden relative">

  <!-- Decorative Dojo Lanterns -->
  <div class="pointer-events-none fixed top-20 left-5 sm:left-14 z-0 opacity-85 lantern">
    <div class="w-1 h-6 bg-amber-900 mx-auto"></div>
    <div class="w-10 h-14 rounded-2xl bg-gradient-to-b from-amber-500 via-orange-600 to-red-700 shadow-[0_0_35px_rgba(255,110,0,0.65)] border border-amber-300/40 flex flex-col justify-around py-1.5">
      <div class="h-0.5 w-full bg-amber-950/50"></div>
      <div class="h-0.5 w-full bg-amber-950/50"></div>
      <div class="h-0.5 w-full bg-amber-950/50"></div>
    </div>
  </div>

  <div class="pointer-events-none fixed top-20 right-5 sm:right-14 z-0 opacity-85 lantern" style="animation-delay: 1.5s;">
    <div class="w-1 h-6 bg-amber-900 mx-auto"></div>
    <div class="w-10 h-14 rounded-2xl bg-gradient-to-b from-amber-500 via-orange-600 to-red-700 shadow-[0_0_35px_rgba(255,110,0,0.65)] border border-amber-300/40 flex flex-col justify-around py-1.5">
      <div class="h-0.5 w-full bg-amber-950/50"></div>
      <div class="h-0.5 w-full bg-amber-950/50"></div>
      <div class="h-0.5 w-full bg-amber-950/50"></div>
    </div>
  </div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas" class="fixed inset-0 z-10"></canvas>

  <!-- TOP HUD -->
  <header class="fixed top-0 left-0 right-0 z-20 px-3 sm:px-6 pt-3 pb-2 flex items-center justify-between gap-2 pointer-events-none">
    <!-- Score Box -->
    <div class="pointer-events-auto bg-black/55 backdrop-blur-md border border-amber-500/40 rounded-2xl px-3.5 py-1.5 shadow-lg flex items-center gap-2.5">
      <div>
        <div class="text-[10px] font-bold tracking-wider text-amber-400 uppercase">SCORE</div>
        <div id="scoreDisplay" class="title-font text-2xl sm:text-3xl text-white leading-none">0</div>
      </div>
      <div class="h-7 w-px bg-white/15"></div>
      <div>
        <div class="text-[10px] font-bold tracking-wider text-orange-300 uppercase">BEST</div>
        <div id="bestDisplay" class="title-font text-lg sm:text-xl text-amber-300 leading-none">0</div>
      </div>
    </div>

    <!-- Level Progress Bar -->
    <div class="hidden sm:flex flex-col items-center flex-1 max-w-xs mx-2 bg-black/45 backdrop-blur-md border border-white/10 rounded-2xl px-4 py-2">
      <div class="w-full flex justify-between text-[11px] font-bold text-amber-200 mb-1">
        <span id="levelLabel">LEVEL 1</span>
        <span id="targetLabel">TARGET: 50</span>
      </div>
      <div class="w-full h-2.5 bg-white/10 rounded-full overflow-hidden">
        <div id="progressBar" class="h-full bg-gradient-to-r from-amber-400 via-orange-500 to-red-500 rounded-full transition-all duration-200" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Lives -->
    <div class="pointer-events-auto flex items-center gap-1.5 sm:gap-2">
      <div id="livesContainer" class="bg-black/55 backdrop-blur-md border border-rose-500/30 rounded-2xl px-2.5 sm:px-3 py-2 flex items-center gap-1 shadow-lg">
        <span class="text-base sm:text-xl">❤️</span>
        <span class="text-base sm:text-xl">❤️</span>
        <span class="text-base sm:text-xl">❤️</span>
      </div>
    </div>
  </header>

  <!-- BOTTOM CONTROL BAR ("😈 GAALI: ON" Toggle + Mute + Level Target) -->
  <footer class="fixed bottom-3 left-0 right-0 z-30 px-4 flex items-center justify-between max-w-3xl mx-auto pointer-events-none">
    <!-- Master Sound Mute/Unmute Toggle -->
    <button id="sfxToggleBtn"
      class="pointer-events-auto btn-3d bg-black/65 backdrop-blur-md border border-white/15 text-white px-3.5 py-2.5 rounded-2xl text-xs sm:text-sm font-bold flex items-center gap-1.5 shadow-lg cursor-pointer">
      <span id="sfxIcon">🔊</span>
      <span id="sfxLabel" class="hidden sm:inline">SOUND ON</span>
    </button>

    <!-- GAALI ON / OFF MAIN BUTTON -->
    <button id="gaaliToggleBtn"
      class="pointer-events-auto btn-3d bg-gradient-to-r from-pink-600 via-rose-600 to-red-600 hover:from-pink-500 hover:to-red-500 text-white font-black px-5 py-2.5 rounded-2xl shadow-[0_4px_0_#881337,0_0_20px_rgba(244,63,94,0.5)] border border-pink-300/40 text-sm sm:text-base tracking-wide flex items-center gap-2 cursor-pointer">
      <span id="gaaliEmoji">😈</span>
      <span id="gaaliStatusText">GAALI: ON</span>
    </button>

    <!-- Mobile Target Pill -->
    <div class="pointer-events-auto bg-black/65 backdrop-blur-md border border-amber-500/30 text-amber-300 px-3.5 py-2.5 rounded-2xl text-xs sm:text-sm font-extrabold shadow-lg">
      <span id="mobileTargetText">LVL 1 • 50</span>
    </div>
  </footer>

  <!-- START / GAME OVER OVERLAY SCREEN -->
  <div id="menuOverlay" class="fixed inset-0 z-30 bg-black/75 backdrop-blur-sm flex flex-col items-center justify-center px-5 text-center">
    <div class="max-w-md w-full bg-gradient-to-b from-[#2b160c]/95 to-[#180b05]/95 border-2 border-amber-500/40 rounded-3xl p-6 sm:p-8 shadow-[0_20px_60px_rgba(0,0,0,0.85)]">
      <div class="inline-block bg-amber-500/20 border border-amber-400/40 text-amber-300 text-xs font-extrabold px-3 py-1 rounded-full mb-3 tracking-wider uppercase">
        ARCADE SWIPE EDITION
      </div>

      <h1 id="menuTitle" class="title-font text-5xl sm:text-6xl text-transparent bg-clip-text bg-gradient-to-b from-yellow-300 via-amber-400 to-orange-600 drop-shadow-[0_5px_0_rgba(120,35,0,0.9)] leading-none mb-3">
        PAGAL NINJA
      </h1>

      <p id="menuSubtitle" class="text-amber-100/90 text-sm sm:text-base font-semibold leading-relaxed mb-5">
        Swipe across the screen to slice ninjas! Watch out for <span class="text-rose-400 font-bold">Bombs</span> or lose a life.
      </p>

      <!-- Final Score Card (Visible on Game Over) -->
      <div id="gameOverStats" class="hidden mb-5 bg-black/50 border border-rose-500/40 rounded-2xl p-4">
        <div class="flex justify-around items-center">
          <div>
            <div class="text-[11px] text-gray-400 uppercase font-bold">Final Score</div>
            <div id="finalScoreVal" class="title-font text-3xl text-white">0</div>
          </div>
          <div class="h-8 w-px bg-white/15"></div>
          <div>
            <div class="text-[11px] text-gray-400 uppercase font-bold">Best Score</div>
            <div id="finalBestVal" class="title-font text-3xl text-amber-400">0</div>
          </div>
        </div>
      </div>

      <!-- Primary Start Button -->
      <button id="startGameBtn"
        class="btn-3d w-full bg-gradient-to-b from-amber-400 via-orange-500 to-red-600 hover:from-amber-300 hover:to-red-500 text-white title-font text-2xl sm:text-3xl py-3.5 px-6 rounded-2xl shadow-[0_6px_0_#7c2d12,0_10px_25px_rgba(234,88,12,0.5)] border border-yellow-200/50 cursor-pointer">
        START GAME
      </button>
    </div>
  </div>

  <script>
    /**
     * PAGAL NINJA - 120FPS HIGH-REFRESH SMOOTH ENGINE
     * - Delta-time normalized physics (identical speed on 60Hz, 90Hz, 120Hz, 144Hz displays)
     * - High-DPI Retina canvas scaling + cached offscreen sprite bitmaps (zero shadowBlur lag)
     * - Coalesced pointermove events for razor-sharp 120Hz+ swipe registration
     * - Pre-configured fixed audio paths in `sounds/`
     */

    // ==========================================
    // 1. PRE-CONFIGURED AUDIO PATHS (`sounds/`)
    // ==========================================
    const AUDIO_PATHS = {
      kills: [
        'sounds/kill1.mp3',
        'sounds/kill2.mp3',
        'sounds/kill3.mp3',
        'sounds/kill4.mp3',
        'sounds/kill5.mp3',
        'sounds/kill6.mp3',
        'sounds/kill7.mp3',
        'sounds/kill8.mp3',
        'sounds/kill9.mp3',
        'sounds/kill10.mp3',
        'sounds/kill11.mp3'
      ],
      bomb: 'sounds/bomb.mp3',
      gameOver: 'sounds/gameover.mp3'
    };

    // ==========================================
    // 2. GAME STATE & CONFIGURATION
    // ==========================================
    const state = {
      running: false,
      score: 0,
      bestScore: parseInt(localStorage.getItem('pagal_ninja_best') || '0', 10),
      lives: 3,
      maxLives: 3,
      level: 1,
      targetScore: 50,
      gaaliMode: true,
      sfxEnabled: true,
      entities: [],
      slicedHalves: [],
      particles: [],
      floatingPopups: [],
      swipeTrail: [],
      isSwiping: false,
      lastSpawnTime: 0,
      spawnInterval: 1150,
      comboCount: 0,
      lastSliceTime: 0,
      lastKillIndex: -1,
      viewW: window.innerWidth,
      viewH: window.innerHeight,
      dpr: Math.min(window.devicePixelRatio || 1, 2)
    };

    // ==========================================
    // 3. DOM REFERENCES
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });

    const scoreDisplay = document.getElementById('scoreDisplay');
    const bestDisplay = document.getElementById('bestDisplay');
    const livesContainer = document.getElementById('livesContainer');
    const levelLabel = document.getElementById('levelLabel');
    const targetLabel = document.getElementById('targetLabel');
    const progressBar = document.getElementById('progressBar');
    const mobileTargetText = document.getElementById('mobileTargetText');

    const gaaliToggleBtn = document.getElementById('gaaliToggleBtn');
    const gaaliEmoji = document.getElementById('gaaliEmoji');
    const gaaliStatusText = document.getElementById('gaaliStatusText');

    const sfxToggleBtn = document.getElementById('sfxToggleBtn');
    const sfxIcon = document.getElementById('sfxIcon');
    const sfxLabel = document.getElementById('sfxLabel');

    const menuOverlay = document.getElementById('menuOverlay');
    const menuTitle = document.getElementById('menuTitle');
    const menuSubtitle = document.getElementById('menuSubtitle');
    const gameOverStats = document.getElementById('gameOverStats');
    const finalScoreVal = document.getElementById('finalScoreVal');
    const finalBestVal = document.getElementById('finalBestVal');
    const startGameBtn = document.getElementById('startGameBtn');

    bestDisplay.textContent = state.bestScore;

    // ==========================================
    // 4. OVERLAPPING AUDIO POOL + WEB AUDIO FALLBACK SFX
    // ==========================================
    let audioCtx = null;

    function unlockWebAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }

    const killPools = AUDIO_PATHS.kills.map((src) => {
      const channels = [];
      for (let c = 0; c < 3; c++) {
        const audio = new Audio();
        audio.preload = 'auto';
        audio.src = src;
        channels.push(audio);
      }
      return { channels, pointer: 0 };
    });

    const bombAudio = new Audio();
    bombAudio.preload = 'auto';
    bombAudio.src = AUDIO_PATHS.bomb;

    const gameOverAudio = new Audio();
    gameOverAudio.preload = 'auto';
    gameOverAudio.src = AUDIO_PATHS.gameOver;

    function stopAllMappedAudio() {
      killPools.forEach(pool => {
        pool.channels.forEach(ch => {
          try {
            ch.pause();
            ch.currentTime = 0;
          } catch (e) {}
        });
      });
      try {
        bombAudio.pause();
        bombAudio.currentTime = 0;
      } catch (e) {}
      try {
        gameOverAudio.pause();
        gameOverAudio.currentTime = 0;
      } catch (e) {}
    }

    function playCleanWhooshSFX() {
      if (!state.sfxEnabled) return;
      unlockWebAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.14);

      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.14);
    }

    function playCleanSlashSFX() {
      if (!state.sfxEnabled) return;
      unlockWebAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(360, now);
      osc.frequency.exponentialRampToValueAtTime(95, now + 0.18);

      gain.gain.setValueAtTime(0.24, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.18);
    }

    function playCleanExplosionSFX() {
      if (!state.sfxEnabled) return;
      unlockWebAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const bufferSize = audioCtx.sampleRate * 0.45;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.14));
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(440, now);
      filter.frequency.exponentialRampToValueAtTime(55, now + 0.45);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.55, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);
    }

    function playCleanGameOverSFX() {
      if (!state.sfxEnabled) return;
      unlockWebAudio();
      if (!audioCtx) return;

      const notes = [330, 293.66, 261.63, 196];
      notes.forEach((freq, idx) => {
        const start = audioCtx.currentTime + idx * 0.14;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, start);

        gain.gain.setValueAtTime(0.22, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.22);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.22);
      });
    }

    function triggerKillAudio() {
      if (!state.sfxEnabled) return;
      unlockWebAudio();

      if (!state.gaaliMode) {
        playCleanSlashSFX();
        return;
      }

      let idx = Math.floor(Math.random() * killPools.length);
      if (killPools.length > 1 && idx === state.lastKillIndex) {
        idx = (idx + 1) % killPools.length;
      }
      state.lastKillIndex = idx;

      const pool = killPools[idx];
      const channel = pool.channels[pool.pointer];
      pool.pointer = (pool.pointer + 1) % pool.channels.length;

      try {
        channel.currentTime = 0;
        const playPromise = channel.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            playCleanSlashSFX();
          });
        }
      } catch (e) {
        playCleanSlashSFX();
      }
    }

    function triggerBombAudio() {
      if (!state.sfxEnabled) return;
      unlockWebAudio();

      if (!state.gaaliMode) {
        playCleanExplosionSFX();
        return;
      }

      try {
        bombAudio.currentTime = 0;
        const playPromise = bombAudio.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            playCleanExplosionSFX();
          });
        }
      } catch (e) {
        playCleanExplosionSFX();
      }
    }

    function triggerGameOverAudio() {
      if (!state.sfxEnabled) return;
      unlockWebAudio();

      if (!state.gaaliMode) {
        playCleanGameOverSFX();
        return;
      }

      try {
        gameOverAudio.currentTime = 0;
        const playPromise = gameOverAudio.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            playCleanGameOverSFX();
          });
        }
      } catch (e) {
        playCleanGameOverSFX();
      }
    }

    // ==========================================
    // 5. HUD UPDATES
    // ==========================================
    function updateHUD() {
      scoreDisplay.textContent = state.score;
      if (state.score > state.bestScore) {
        state.bestScore = state.score;
        localStorage.setItem('pagal_ninja_best', state.bestScore.toString());
      }
      bestDisplay.textContent = state.bestScore;

      state.level = Math.floor(state.score / 50) + 1;
      state.targetScore = state.level * 50;
      const prevLevelScore = (state.level - 1) * 50;
      const pct = Math.min(100, Math.max(0, ((state.score - prevLevelScore) / 50) * 100));

      levelLabel.textContent = `LEVEL ${state.level}`;
      targetLabel.textContent = `TARGET: ${state.targetScore}`;
      progressBar.style.width = `${pct}%`;
      mobileTargetText.textContent = `LVL ${state.level} • ${state.targetScore}`;

      let heartsHTML = '';
      for (let i = 0; i < state.maxLives; i++) {
        if (i < state.lives) {
          heartsHTML += `<span class="text-base sm:text-xl transition-transform scale-100">❤️</span>`;
        } else {
          heartsHTML += `<span class="text-base sm:text-xl opacity-25 grayscale">🖤</span>`;
        }
      }
      livesContainer.innerHTML = heartsHTML;
    }

    // ==========================================
    // 6. HIGH-DPI CANVAS & OFFSCREEN SPRITE CACHE (120FPS OPTIMIZATION)
    // ==========================================
    const NINJA_COLORS = [
      { id: 'sky', body: '#38bdf8', band: '#0284c7', juice: '#38bdf8' },
      { id: 'green', body: '#4ade80', band: '#16a34a', juice: '#4ade80' },
      { id: 'pink', body: '#f472b6', band: '#db2777', juice: '#f472b6' },
      { id: 'yellow', body: '#facc15', band: '#ca8a04', juice: '#facc15' },
      { id: 'orange', body: '#fb923c', band: '#ea580c', juice: '#fb923c' }
    ];

    const spriteCache = new Map();

    function getCachedNinjaSprite(theme, radius) {
      const key = `ninja_${theme.id}_${radius}_${state.dpr}`;
      if (spriteCache.has(key)) return spriteCache.get(key);

      const pad = 22;
      const size = Math.ceil((radius * 2 + pad * 2) * state.dpr);
      const off = document.createElement('canvas');
      off.width = size;
      off.height = size;
      const octx = off.getContext('2d');
      octx.scale(state.dpr, state.dpr);
      octx.translate(radius + pad, radius + pad);

      const color = theme.body;
      octx.shadowColor = color;
      octx.shadowBlur = 12;

      octx.strokeStyle = '#ffffff';
      octx.lineWidth = 4;
      octx.lineCap = 'round';

      // Torso
      octx.beginPath();
      octx.moveTo(0, -radius * 0.1);
      octx.lineTo(0, radius * 0.45);
      octx.stroke();

      // Arms
      octx.beginPath();
      octx.moveTo(-radius * 0.45, radius * 0.05);
      octx.lineTo(0, radius * 0.15);
      octx.lineTo(radius * 0.48, -radius * 0.08);
      octx.stroke();

      // Legs
      octx.beginPath();
      octx.moveTo(-radius * 0.35, radius * 0.85);
      octx.lineTo(0, radius * 0.45);
      octx.lineTo(radius * 0.35, radius * 0.85);
      octx.stroke();

      // Head
      octx.fillStyle = color;
      octx.beginPath();
      octx.arc(0, -radius * 0.38, radius * 0.36, 0, Math.PI * 2);
      octx.fill();
      octx.stroke();

      // Ninja Headband
      octx.fillStyle = '#ef4444';
      octx.fillRect(-radius * 0.36, -radius * 0.52, radius * 0.72, radius * 0.14);

      // Eyes
      octx.shadowBlur = 0;
      octx.fillStyle = '#ffffff';
      octx.beginPath();
      octx.arc(-radius * 0.13, -radius * 0.34, radius * 0.1, 0, Math.PI * 2);
      octx.arc(radius * 0.13, -radius * 0.34, radius * 0.1, 0, Math.PI * 2);
      octx.fill();

      octx.fillStyle = '#0f172a';
      octx.beginPath();
      octx.arc(-radius * 0.11, -radius * 0.34, radius * 0.045, 0, Math.PI * 2);
      octx.arc(radius * 0.15, -radius * 0.34, radius * 0.045, 0, Math.PI * 2);
      octx.fill();

      const entry = { canvas: off, logicalSize: radius * 2 + pad * 2 };
      spriteCache.set(key, entry);
      return entry;
    }

    function getCachedBombSprite(radius) {
      const key = `bomb_${radius}_${state.dpr}`;
      if (spriteCache.has(key)) return spriteCache.get(key);

      const pad = 26;
      const size = Math.ceil((radius * 2 + pad * 2) * state.dpr);
      const off = document.createElement('canvas');
      off.width = size;
      off.height = size;
      const octx = off.getContext('2d');
      octx.scale(state.dpr, state.dpr);
      octx.translate(radius + pad, radius + pad);

      const r = radius * 0.85;
      octx.shadowColor = '#ef4444';
      octx.shadowBlur = 18;

      const grad = octx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
      grad.addColorStop(0, '#475569');
      grad.addColorStop(0.5, '#1e293b');
      grad.addColorStop(1, '#020617');

      octx.fillStyle = grad;
      octx.beginPath();
      octx.arc(0, 0, r, 0, Math.PI * 2);
      octx.fill();

      octx.lineWidth = 3;
      octx.strokeStyle = '#ef4444';
      octx.stroke();

      // Fuse
      octx.shadowBlur = 0;
      octx.strokeStyle = '#d97706';
      octx.lineWidth = 4;
      octx.beginPath();
      octx.moveTo(0, -r);
      octx.quadraticCurveTo(r * 0.3, -r * 1.35, r * 0.55, -r * 1.2);
      octx.stroke();

      octx.fillStyle = '#ef4444';
      octx.font = `bold ${Math.round(r * 0.85)}px Inter, sans-serif`;
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.fillText('💣', 0, 2);

      const entry = { canvas: off, logicalSize: radius * 2 + pad * 2, r };
      spriteCache.set(key, entry);
      return entry;
    }

    function resizeCanvas() {
      state.viewW = window.innerWidth;
      state.viewH = window.innerHeight;
      state.dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(state.viewW * state.dpr);
      canvas.height = Math.floor(state.viewH * state.dpr);
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      spriteCache.clear();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const HIT_WORDS = ['SLICE!', 'SLASH!', 'HIT!', 'CRIT!', 'BOOM!'];

    // Physics calibrated at 60Hz baseline and scaled smoothly via delta-time (dtScale)
    function spawnEntity() {
      const isBomb = Math.random() < Math.min(0.28, 0.14 + state.level * 0.02);
      const radius = Math.round(Math.max(34, Math.min(46, state.viewW * 0.055)));
      const margin = radius + 24;
      const x = margin + Math.random() * Math.max(40, state.viewW - margin * 2);
      const y = state.viewH + radius;

      const centerBias = (state.viewW / 2 - x) * (0.004 + Math.random() * 0.004);
      const vx = centerBias + (Math.random() - 0.5) * 2.5;
      const minVy = -Math.sqrt(2 * 0.24 * (state.viewH * 0.62));
      const maxVy = -Math.sqrt(2 * 0.24 * (state.viewH * 0.84));
      const vy = minVy + Math.random() * (maxVy - minVy);

      const theme = NINJA_COLORS[Math.floor(Math.random() * NINJA_COLORS.length)];

      state.entities.push({
        id: Math.random(),
        type: isBomb ? 'bomb' : 'ninja',
        x,
        y,
        vx,
        vy,
        radius,
        rotation: (Math.random() - 0.5) * 0.4,
        vRot: (Math.random() - 0.5) * 0.07,
        theme,
        sliced: false,
        enteredScreen: false
      });
    }

    function createExplosionParticles(x, y, color, count = 18) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 7;
        state.particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 3 + Math.random() * 5,
          color,
          alpha: 1,
          decay: 0.02 + Math.random() * 0.02
        });
      }
    }

    function createFloatingPopup(x, y, text, color = '#fde047') {
      state.floatingPopups.push({
        x,
        y,
        vy: -2.2,
        text,
        color,
        alpha: 1
      });
    }

    // ==========================================
    // 7. SLICING & COLLISION DETECTION
    // ==========================================
    function lineCircleIntersect(x1, y1, x2, y2, cx, cy, r) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const lenSq = dx * dx + dy * dy;
      if (lenSq === 0) {
        return Math.hypot(cx - x1, cy - y1) <= r;
      }
      let t = ((cx - x1) * dx + (cy - y1) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));
      const closestX = x1 + t * dx;
      const closestY = y1 + t * dy;
      return Math.hypot(cx - closestX, cy - closestY) <= r;
    }

    function checkSwipeCollisions(x1, y1, x2, y2) {
      if (!state.running) return;

      for (let i = state.entities.length - 1; i >= 0; i--) {
        const ent = state.entities[i];
        if (ent.sliced) continue;

        if (lineCircleIntersect(x1, y1, x2, y2, ent.x, ent.y, ent.radius * 1.08)) {
          ent.sliced = true;

          if (ent.type === 'bomb') {
            triggerBombAudio();
            createExplosionParticles(ent.x, ent.y, '#ef4444', 32);
            createExplosionParticles(ent.x, ent.y, '#facc15', 20);
            createFloatingPopup(ent.x, ent.y - 20, 'BOOM! -1 ❤️', '#f87171');

            document.body.classList.remove('shake');
            void document.body.offsetWidth;
            document.body.classList.add('shake');

            state.lives = Math.max(0, state.lives - 1);
            updateHUD();

            if (state.lives <= 0) {
              endGame();
              return;
            }
          } else {
            triggerKillAudio();

            const now = performance.now();
            if (now - state.lastSliceTime < 450) {
              state.comboCount += 1;
            } else {
              state.comboCount = 1;
            }
            state.lastSliceTime = now;

            const bonus = state.comboCount >= 2 ? state.comboCount : 0;
            const points = 3 + bonus;
            state.score += points;
            updateHUD();

            state.slicedHalves.push(
              {
                x: ent.x - 10,
                y: ent.y,
                vx: ent.vx - 3.2,
                vy: ent.vy - 2,
                rotation: ent.rotation - 0.2,
                vRot: -0.09,
                radius: ent.radius,
                theme: ent.theme,
                half: 'top',
                alpha: 1
              },
              {
                x: ent.x + 10,
                y: ent.y + 12,
                vx: ent.vx + 3.2,
                vy: ent.vy + 1,
                rotation: ent.rotation + 0.2,
                vRot: 0.09,
                radius: ent.radius,
                theme: ent.theme,
                half: 'bottom',
                alpha: 1
              }
            );

            createExplosionParticles(ent.x, ent.y, ent.theme.juice, 18);
            const hitWord = HIT_WORDS[Math.floor(Math.random() * HIT_WORDS.length)];
            const label = state.comboCount >= 2 ? `${state.comboCount}x COMBO! +${points}` : `${hitWord} +${points}`;
            createFloatingPopup(ent.x, ent.y - 25, label, '#fde047');
          }

          state.entities.splice(i, 1);
        }
      }
    }

    // ==========================================
    // 8. FAST BLIT DRAWING HELPERS
    // ==========================================
    function drawCharacterFace(targetCtx, cx, cy, headR) {
      targetCtx.save();
      targetCtx.translate(cx, cy);

      // Face base
      targetCtx.fillStyle = '#f3d2b3';
      targetCtx.strokeStyle = '#1e293b';
      targetCtx.lineWidth = 2.2;
      targetCtx.beginPath();
      targetCtx.arc(0, 0, headR, 0, Math.PI * 2);
      targetCtx.fill();
      targetCtx.stroke();

      // Silver-grey hair & beard accents
      targetCtx.fillStyle = '#cbd5e1';
      targetCtx.beginPath();
      targetCtx.arc(0, -headR * 0.28, headR * 0.86, Math.PI * 1.08, Math.PI * 1.92);
      targetCtx.fill();

      // Beard lower contour
      targetCtx.fillStyle = 'rgba(203, 213, 225, 0.72)';
      targetCtx.beginPath();
      targetCtx.arc(0, headR * 0.22, headR * 0.72, 0.15 * Math.PI, 0.85 * Math.PI);
      targetCtx.fill();

      // Expressive eyes
      targetCtx.fillStyle = '#0f172a';
      targetCtx.beginPath();
      targetCtx.arc(-headR * 0.32, -headR * 0.08, Math.max(1.8, headR * 0.11), 0, Math.PI * 2);
      targetCtx.arc(headR * 0.32, -headR * 0.08, Math.max(1.8, headR * 0.11), 0, Math.PI * 2);
      targetCtx.fill();

      // Friendly smile
      targetCtx.strokeStyle = '#334155';
      targetCtx.lineWidth = 1.8;
      targetCtx.beginPath();
      targetCtx.arc(0, headR * 0.22, headR * 0.34, 0.12 * Math.PI, 0.88 * Math.PI);
      targetCtx.stroke();

      targetCtx.restore();
    }

    function drawNinjaCharacter(ent) {
      const sprite = getCachedNinjaSprite(ent.theme, ent.radius);
      ctx.save();
      ctx.translate(ent.x, ent.y);
      ctx.rotate(ent.rotation);
      const half = sprite.logicalSize * 0.5;
      ctx.drawImage(sprite.canvas, -half, -half, sprite.logicalSize, sprite.logicalSize);
      drawCharacterFace(ctx, 0, -ent.radius * 0.38, ent.radius * 0.36);
      ctx.restore();
    }

    function drawSlicedHalf(h) {
      ctx.save();
      ctx.globalAlpha = h.alpha;
      ctx.translate(h.x, h.y);
      ctx.rotate(h.rotation);

      const r = h.radius;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';

      if (h.half === 'top') {
        drawCharacterFace(ctx, 0, -r * 0.25, r * 0.34);
      } else {
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.1);
        ctx.lineTo(0, r * 0.25);
        ctx.moveTo(-r * 0.32, r * 0.65);
        ctx.lineTo(0, r * 0.25);
        ctx.lineTo(r * 0.32, r * 0.65);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawBomb(ent, timestamp) {
      const sprite = getCachedBombSprite(ent.radius);
      const r = sprite.r;
      ctx.save();
      ctx.translate(ent.x, ent.y);
      ctx.rotate(ent.rotation);

      const half = sprite.logicalSize * 0.5;
      ctx.drawImage(sprite.canvas, -half, -half, sprite.logicalSize, sprite.logicalSize);

      // Animated Fuse Spark
      const flicker = Math.sin(timestamp * 0.045) > 0;
      ctx.fillStyle = flicker ? '#fde047' : '#f97316';
      ctx.beginPath();
      ctx.arc(r * 0.55, -r * 1.2, flicker ? 8.5 : 6.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawSwipeTrail(now) {
      while (state.swipeTrail.length > 0 && now - state.swipeTrail[0].time > 150) {
        state.swipeTrail.shift();
      }

      if (state.swipeTrail.length < 2) return;

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const glowColor = state.gaaliMode ? 'rgba(244, 63, 94, 0.45)' : 'rgba(56, 189, 248, 0.45)';

      for (let i = 1; i < state.swipeTrail.length; i++) {
        const p1 = state.swipeTrail[i - 1];
        const p2 = state.swipeTrail[i];
        const age = (now - p2.time) / 150;
        const alpha = Math.max(0, 1 - age);
        const width = Math.max(2, (1 - age) * 14);

        // Outer glow stroke (fast, no expensive shadowBlur filter)
        ctx.strokeStyle = glowColor;
        ctx.lineWidth = width + 7;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();

        // Crisp inner blade core
        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    // ==========================================
    // 9. DELTA-TIME NORMALIZED 120FPS GAME LOOP
    // ==========================================
    let lastFrameTime = performance.now();

    function gameLoop(timestamp) {
      // Normalize frame delta to 60Hz baseline so 120Hz/144Hz runs at exact physics speed with double the smoothness
      const rawDt = timestamp - lastFrameTime;
      lastFrameTime = timestamp;
      const dtScale = Math.min(2.5, Math.max(0.25, rawDt / 16.6667));

      ctx.clearRect(0, 0, state.viewW, state.viewH);

      if (state.running) {
        const currentInterval = Math.max(520, state.spawnInterval - (state.level - 1) * 85);
        if (timestamp - state.lastSpawnTime > currentInterval) {
          const burstCount = state.level >= 3 && Math.random() < 0.35 ? 2 : 1;
          for (let b = 0; b < burstCount; b++) {
            spawnEntity();
          }
          state.lastSpawnTime = timestamp;
        }
      }

      const gravity = 0.24 * dtScale;

      for (let i = state.entities.length - 1; i >= 0; i--) {
        const ent = state.entities[i];
        ent.x += ent.vx * dtScale;
        ent.y += ent.vy * dtScale;
        ent.vy += gravity;
        ent.rotation += ent.vRot * dtScale;

        if (ent.y < state.viewH - ent.radius) {
          ent.enteredScreen = true;
        }

        if (ent.type === 'bomb') {
          drawBomb(ent, timestamp);
        } else {
          drawNinjaCharacter(ent);
        }

        if (ent.enteredScreen && ent.y > state.viewH + ent.radius * 2) {
          state.entities.splice(i, 1);
        }
      }

      for (let i = state.slicedHalves.length - 1; i >= 0; i--) {
        const h = state.slicedHalves[i];
        h.x += h.vx * dtScale;
        h.y += h.vy * dtScale;
        h.vy += gravity * 1.1;
        h.rotation += h.vRot * dtScale;
        h.alpha -= 0.018 * dtScale;

        if (h.alpha <= 0) {
          state.slicedHalves.splice(i, 1);
        } else {
          drawSlicedHalf(h);
        }
      }

      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx * dtScale;
        p.y += p.vy * dtScale;
        p.vy += 0.14 * dtScale;
        p.alpha -= p.decay * dtScale;

        if (p.alpha <= 0) {
          state.particles.splice(i, 1);
        } else {
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      for (let i = state.floatingPopups.length - 1; i >= 0; i--) {
        const pop = state.floatingPopups[i];
        pop.y += pop.vy * dtScale;
        pop.alpha -= 0.022 * dtScale;

        if (pop.alpha <= 0) {
          state.floatingPopups.splice(i, 1);
        } else {
          ctx.save();
          ctx.globalAlpha = pop.alpha;
          ctx.font = '900 22px Bungee, Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.lineWidth = 4;
          ctx.strokeStyle = 'rgba(0,0,0,0.85)';
          ctx.strokeText(pop.text, pop.x, pop.y);
          ctx.fillStyle = pop.color;
          ctx.fillText(pop.text, pop.x, pop.y);
          ctx.restore();
        }
      }

      drawSwipeTrail(timestamp);

      requestAnimationFrame(gameLoop);
    }

    // ==========================================
    // 10. 120HZ COALESCED POINTER SWIPE HANDLERS
    // ==========================================
    function addSwipePoint(x, y, time) {
      const prev = state.swipeTrail[state.swipeTrail.length - 1];
      state.swipeTrail.push({ x, y, time });

      if (prev && time - prev.time < 90) {
        const dist = Math.hypot(x - prev.x, y - prev.y);
        if (dist > 14 && Math.random() < 0.22) {
          playCleanWhooshSFX();
        }
        checkSwipeCollisions(prev.x, prev.y, x, y);
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      unlockWebAudio();
      state.isSwiping = true;
      state.swipeTrail = [{ x: e.clientX, y: e.clientY, time: performance.now() }];
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!state.isSwiping && e.pointerType === 'mouse' && e.buttons === 0) return;
      const now = performance.now();
      const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for (let i = 0; i < events.length; i++) {
        addSwipePoint(events[i].clientX, events[i].clientY, now);
      }
    });

    window.addEventListener('pointerup', () => {
      state.isSwiping = false;
    });

    // ==========================================
    // 11. GAME FLOW CONTROLS (START / END / MODES)
    // ==========================================
    function startGame() {
      unlockWebAudio();
      stopAllMappedAudio();
      state.running = true;
      state.score = 0;
      state.lives = state.maxLives;
      state.level = 1;
      state.comboCount = 0;
      state.entities = [];
      state.slicedHalves = [];
      state.particles = [];
      state.floatingPopups = [];
      state.lastSpawnTime = performance.now();

      updateHUD();
      menuOverlay.classList.add('hidden');
      gameOverStats.classList.add('hidden');
    }

    function endGame() {
      state.running = false;
      triggerGameOverAudio();

      menuTitle.textContent = 'GAME OVER';
      menuSubtitle.textContent = 'Play again and beat your high score!';
      finalScoreVal.textContent = state.score;
      finalBestVal.textContent = state.bestScore;
      startGameBtn.textContent = 'PLAY AGAIN';

      gameOverStats.classList.remove('hidden');
      menuOverlay.classList.remove('hidden');
    }

    startGameBtn.addEventListener('click', startGame);

    gaaliToggleBtn.addEventListener('click', () => {
      unlockWebAudio();
      stopAllMappedAudio();
      state.gaaliMode = !state.gaaliMode;

      if (state.gaaliMode) {
        gaaliEmoji.textContent = '😈';
        gaaliStatusText.textContent = 'GAALI: ON';
        gaaliToggleBtn.className = "pointer-events-auto btn-3d bg-gradient-to-r from-pink-600 via-rose-600 to-red-600 hover:from-pink-500 hover:to-red-500 text-white font-black px-5 py-2.5 rounded-2xl shadow-[0_4px_0_#881337,0_0_20px_rgba(244,63,94,0.5)] border border-pink-300/40 text-sm sm:text-base tracking-wide flex items-center gap-2 cursor-pointer";
      } else {
        gaaliEmoji.textContent = '😇';
        gaaliStatusText.textContent = 'GAALI: OFF';
        gaaliToggleBtn.className = "pointer-events-auto btn-3d bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-600 hover:from-emerald-500 hover:to-cyan-500 text-white font-black px-5 py-2.5 rounded-2xl shadow-[0_4px_0_#065f46,0_0_20px_rgba(16,185,129,0.45)] border border-emerald-300/40 text-sm sm:text-base tracking-wide flex items-center gap-2 cursor-pointer";
      }
    });

    sfxToggleBtn.addEventListener('click', () => {
      state.sfxEnabled = !state.sfxEnabled;
      if (!state.sfxEnabled) {
        stopAllMappedAudio();
      } else {
        unlockWebAudio();
      }
      sfxIcon.textContent = state.sfxEnabled ? '🔊' : '🔇';
      sfxLabel.textContent = state.sfxEnabled ? 'SOUND ON' : 'SOUND OFF';
    });

    window.onload = function () {
      updateHUD();
      lastFrameTime = performance.now();
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
