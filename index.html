<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pagal Ninja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #2d170b;
      font-family: 'Inter', sans-serif;
      color: #fff;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .arcade-title {
      font-family: 'Bangers', cursive;
      letter-spacing: 2px;
    }

    .gaali-toggle-btn {
      transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .gaali-toggle-btn:active {
      transform: scale(0.95);
    }

    .gaali-on {
      background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.45);
    }

    .gaali-off {
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      box-shadow: 0 0 18px rgba(14, 165, 233, 0.5);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- Top HUD -->
  <div class="pointer-events-none fixed top-0 left-0 right-0 z-20 flex items-center justify-between px-3.5 py-3 sm:px-6">
    <!-- Score Box + Progress Stars -->
    <div class="flex items-center gap-2.5 sm:gap-4">
      <div class="rounded-xl border border-amber-500/35 bg-[#201007]/85 px-3 py-1.5 shadow-lg backdrop-blur-sm">
        <div class="text-[9px] font-extrabold uppercase tracking-widest text-amber-300/80">SCORE</div>
        <div id="scoreVal" class="text-xl font-black leading-none text-white sm:text-2xl">0</div>
      </div>

      <!-- Level Progress Bar with Stars -->
      <div class="hidden items-center gap-1.5 sm:flex">
        <div class="relative h-2.5 w-32 overflow-hidden rounded-full border border-amber-500/30 bg-black/50">
          <div id="progressFill" class="h-full w-0 rounded-full bg-gradient-to-r from-amber-400 to-orange-500 transition-all duration-200"></div>
        </div>
        <span id="star1" class="text-xs opacity-35">⭐</span>
        <span id="star2" class="text-xs opacity-35">⭐</span>
      </div>
    </div>

    <!-- Hearts (Lives) -->
    <div id="livesContainer" class="flex items-center gap-1 rounded-xl border border-rose-500/25 bg-[#201007]/85 px-3 py-1.5 text-lg shadow-lg backdrop-blur-sm sm:text-xl">
      <span>❤️</span><span>❤️</span><span>❤️</span>
    </div>
  </div>

  <!-- Bottom HUD Bar -->
  <div class="pointer-events-none fixed bottom-3 left-0 right-0 z-20 flex items-center justify-between px-4 sm:px-6">
    <!-- Left GAALI Toggle -->
    <button
      id="gaaliToggleBtn"
      class="gaali-toggle-btn gaali-on pointer-events-auto flex items-center gap-2 rounded-full px-4 py-2 text-xs font-black tracking-wider text-white sm:px-5 sm:py-2.5 sm:text-sm"
    >
      <span id="gaaliBtnText">😈 GAALI: ON</span>
    </button>

    <!-- Right Level & Target Info -->
    <div class="flex items-center gap-2 rounded-xl border border-amber-500/25 bg-[#201007]/85 px-3 py-1.5 text-[11px] font-extrabold tracking-wider text-amber-200/90 backdrop-blur-sm sm:text-xs">
      <span id="levelText">LEVEL 1</span>
      <span class="text-amber-500">•</span>
      <span class="text-amber-400">TARGET <span id="targetText">55</span></span>
    </div>
  </div>

  <!-- Start Overlay -->
  <div id="startOverlay" class="fixed inset-0 z-30 flex items-center justify-center bg-black/60 px-4 backdrop-blur-[2px]">
    <div class="w-full max-w-sm rounded-3xl border border-amber-500/35 bg-[#241208]/95 p-6 text-center shadow-2xl">
      <h1 class="arcade-title bg-gradient-to-b from-yellow-300 via-amber-400 to-orange-500 bg-clip-text text-5xl text-transparent drop-shadow sm:text-6xl">
        PAGAL NINJA
      </h1>
      <p class="mt-3 text-xs leading-relaxed text-amber-100/85 sm:text-sm">
        Ungli se swipe karo, ninja dushmano ko kaat ke nikal jaayega. Dushman chhoo gaya toh dil kam!
      </p>

      <button
        id="startBtn"
        class="mt-6 w-full rounded-2xl bg-gradient-to-r from-amber-500 via-orange-500 to-red-500 py-3.5 text-base font-black uppercase tracking-wider text-white shadow-lg shadow-orange-600/35 transition hover:brightness-110 active:scale-[0.98]"
      >
        START KARO
      </button>
    </div>
  </div>

  <!-- Game Over Overlay -->
  <div id="gameOverOverlay" class="fixed inset-0 z-30 hidden items-center justify-center bg-black/75 px-4 backdrop-blur-sm">
    <div class="w-full max-w-sm rounded-3xl border border-rose-500/40 bg-[#241208]/95 p-6 text-center shadow-2xl">
      <h2 class="arcade-title bg-gradient-to-b from-amber-300 via-orange-400 to-rose-500 bg-clip-text text-5xl text-transparent">
        GAME OVER
      </h2>

      <div class="mt-5 grid grid-cols-2 gap-3 rounded-2xl border border-amber-500/25 bg-black/40 p-4">
        <div>
          <div class="text-[10px] font-extrabold uppercase tracking-wider text-amber-200/70">SCORE</div>
          <div id="finalScoreVal" class="mt-1 text-3xl font-black text-white">0</div>
        </div>
        <div class="border-l border-amber-500/20">
          <div class="text-[10px] font-extrabold uppercase tracking-wider text-amber-300/80">BEST</div>
          <div id="finalBestVal" class="mt-1 text-3xl font-black text-amber-400">0</div>
        </div>
      </div>

      <button
        id="playAgainBtn"
        class="mt-6 w-full rounded-2xl bg-gradient-to-r from-amber-500 via-orange-500 to-red-500 py-3.5 text-base font-black uppercase tracking-wider text-white shadow-lg shadow-orange-600/35 transition hover:brightness-110 active:scale-[0.98]"
      >
        PHIR SE KHELO
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('scoreVal');
    const livesContainer = document.getElementById('livesContainer');
    const progressFill = document.getElementById('progressFill');
    const star1 = document.getElementById('star1');
    const star2 = document.getElementById('star2');
    const levelText = document.getElementById('levelText');
    const targetText = document.getElementById('targetText');

    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScoreEl = document.getElementById('finalScoreVal');
    const finalBestEl = document.getElementById('finalBestVal');
    const startBtn = document.getElementById('startBtn');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const gaaliToggleBtn = document.getElementById('gaaliToggleBtn');
    const gaaliBtnText = document.getElementById('gaaliBtnText');

    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resizeCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Persistent Best Score & Gaali Toggle
    const BEST_KEY = 'pagal_ninja_stick_best_v1';
    const GAALI_KEY = 'pagal_ninja_gaali_mode_v1';

    let bestScore = Number(localStorage.getItem(BEST_KEY) || 0);
    let gaaliEnabled = localStorage.getItem(GAALI_KEY) !== 'off';
    updateGaaliButtonUI();

    function updateGaaliButtonUI() {
      if (gaaliEnabled) {
        gaaliBtnText.textContent = '😈 GAALI: ON';
        gaaliToggleBtn.classList.remove('gaali-off');
        gaaliToggleBtn.classList.add('gaali-on');
      } else {
        gaaliBtnText.textContent = '😇 GAALI: OFF';
        gaaliToggleBtn.classList.remove('gaali-on');
        gaaliToggleBtn.classList.add('gaali-off');
      }
    }

    // Fallback Web Audio SFX (used only when GAALI is OFF or MP3 isn't uploaded yet)
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playFallbackSfx(type) {
      const ctxAudio = getAudioCtx();
      if (!ctxAudio) return;

      const now = ctxAudio.currentTime;
      const osc = ctxAudio.createOscillator();
      const gain = ctxAudio.createGain();

      if (type === 'kill') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(560, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.1);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
        osc.connect(gain);
        gain.connect(ctxAudio.destination);
        osc.start(now);
        osc.stop(now + 0.11);
      } else if (type === 'bomb') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
        gain.gain.setValueAtTime(0.24, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
        osc.connect(gain);
        gain.connect(ctxAudio.destination);
        osc.start(now);
        osc.stop(now + 0.36);
      } else if (type === 'gameover') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(290, now);
        osc.frequency.linearRampToValueAtTime(115, now + 0.45);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.46);
        osc.connect(gain);
        gain.connect(ctxAudio.destination);
        osc.start(now);
        osc.stop(now + 0.46);
      }
    }

    // Pre-mapped MP3 sounds in `sounds/` directory
    const SOUND_PATHS = {
      kills: [
        'sounds/kill1.mp3',
        'sounds/kill2.mp3',
        'sounds/kill3.mp3',
        'sounds/kill4.mp3',
        'sounds/kill5.mp3',
        'sounds/kill6.mp3',
        'sounds/kill7.mp3',
        'sounds/kill8.mp3',
        'sounds/kill9.mp3',
        'sounds/kill10.mp3'
      ],
      bomb: 'sounds/bomb.mp3',
      gameover: 'sounds/gameover.mp3'
    };

    const availableSounds = {
      kills: new Array(SOUND_PATHS.kills.length).fill(false),
      bomb: false,
      gameover: false
    };

    const activeAudioPool = [];

    function probeAudio(url, onReady) {
      const probe = new Audio();
      probe.preload = 'auto';
      probe.src = url;
      probe.addEventListener('canplaythrough', () => onReady(true), { once: true });
      probe.addEventListener('loadeddata', () => onReady(true), { once: true });
      probe.addEventListener('error', () => onReady(false), { once: true });
      probe.load();
    }

    function initSoundSystem() {
      SOUND_PATHS.kills.forEach((url, idx) => {
        probeAudio(url, (ok) => {
          availableSounds.kills[idx] = ok;
        });
      });
      probeAudio(SOUND_PATHS.bomb, (ok) => {
        availableSounds.bomb = ok;
      });
      probeAudio(SOUND_PATHS.gameover, (ok) => {
        availableSounds.gameover = ok;
      });
    }

    initSoundSystem();

    function playMp3Overlapping(url, volume = 1.0) {
      const audio = new Audio(url);
      audio.volume = volume;
      activeAudioPool.push(audio);
      audio.addEventListener('ended', () => {
        const i = activeAudioPool.indexOf(audio);
        if (i !== -1) activeAudioPool.splice(i, 1);
      });
      audio.play().catch(() => {
        playFallbackSfx('kill');
      });
    }

    function stopAllActiveAudio() {
      while (activeAudioPool.length > 0) {
        const a = activeAudioPool.pop();
        try {
          a.pause();
          a.currentTime = 0;
        } catch (_) {}
      }
    }

    function triggerKillSound() {
      if (!gaaliEnabled) {
        playFallbackSfx('kill');
        return;
      }
      const readyIndices = [];
      for (let i = 0; i < SOUND_PATHS.kills.length; i++) {
        if (availableSounds.kills[i]) readyIndices.push(i);
      }
      const chosenIdx = readyIndices.length > 0
        ? readyIndices[Math.floor(Math.random() * readyIndices.length)]
        : Math.floor(Math.random() * SOUND_PATHS.kills.length);

      playMp3Overlapping(SOUND_PATHS.kills[chosenIdx], 1.0);
    }

    function triggerBombSound() {
      if (!gaaliEnabled) {
        playFallbackSfx('bomb');
        return;
      }
      if (availableSounds.bomb) {
        playMp3Overlapping(SOUND_PATHS.bomb, 1.0);
      } else {
        playFallbackSfx('bomb');
      }
    }

    function triggerGameOverSound() {
      if (!gaaliEnabled) {
        playFallbackSfx('gameover');
        return;
      }
      if (availableSounds.gameover) {
        playMp3Overlapping(SOUND_PATHS.gameover, 1.0);
      } else {
        playFallbackSfx('gameover');
      }
    }

    gaaliToggleBtn.addEventListener('click', () => {
      gaaliEnabled = !gaaliEnabled;
      localStorage.setItem(GAALI_KEY, gaaliEnabled ? 'on' : 'off');
      updateGaaliButtonUI();
      if (!gaaliEnabled) {
        stopAllActiveAudio();
      }
      getAudioCtx();
    });

    // Game State & Stickman Ninja Visuals (matching original video)
    let gameState = 'menu'; // 'menu' | 'playing' | 'gameover'
    let score = 0;
    let lives = 3;
    let level = 1;
    let targetScore = 55;
    let spawnTimer = 0;
    let screenShake = 0;
    let flashAlpha = 0;

    // Player Hero Stickman Ninja
    const player = {
      x: width * 0.5,
      y: height * 0.72,
      targetX: width * 0.5,
      targetY: height * 0.72,
      slashAnim: 0,
      slashAngle: 0,
      facing: 1
    };

    const enemies = [];
    const slicedStickParts = [];
    const floatingTexts = [];
    const trailPoints = [];
    const petals = [];

    // Sakura petals floating in dojo
    for (let i = 0; i < 18; i++) {
      petals.push({
        x: Math.random() * 1200,
        y: Math.random() * 900,
        vx: (Math.random() - 0.5) * 18,
        vy: 18 + Math.random() * 24,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 2,
        size: 3 + Math.random() * 2.5
      });
    }

    const STICK_ENEMY_STYLES = [
      { outline: '#38bdf8', band: '#f97316', skin: '#f5d0a9', expression: 'glasses' },
      { outline: '#a3e635', band: '#ffffff', skin: '#d99b66', expression: 'smug' },
      { outline: '#f472b6', band: '#fde047', skin: '#f5d0a9', expression: 'glasses' },
      { outline: '#fbbf24', band: '#ef4444', skin: '#e8b88a', expression: 'angry' }
    ];

    const HIT_ONOMA = ['THOK!', 'POOT!', 'ABE!', 'AREE!', 'KHACH!'];

    function updateHud() {
      scoreEl.textContent = score;
      level = Math.floor(score / 55) + 1;
      targetScore = level * 55;
      levelText.textContent = `LEVEL ${level}`;
      targetText.textContent = targetScore;

      const levelProgress = Math.min(100, ((score % 55) / 55) * 100);
      progressFill.style.width = `${levelProgress}%`;
      star1.style.opacity = levelProgress >= 45 ? '1' : '0.35';
      star2.style.opacity = levelProgress >= 85 ? '1' : '0.35';

      let heartsHtml = '';
      for (let i = 0; i < 3; i++) {
        heartsHtml += i < lives ? '<span>❤️</span>' : '<span class="opacity-30">🖤</span>';
      }
      livesContainer.innerHTML = heartsHtml;
    }

    function startGame() {
      getAudioCtx();
      score = 0;
      lives = 3;
      spawnTimer = 0.2;
      screenShake = 0;
      flashAlpha = 0;
      enemies.length = 0;
      slicedStickParts.length = 0;
      floatingTexts.length = 0;
      trailPoints.length = 0;

      player.x = width * 0.5;
      player.y = height * 0.72;
      player.targetX = player.x;
      player.targetY = player.y;
      player.slashAnim = 0;

      gameState = 'playing';
      updateHud();
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
    }

    function endGame() {
      if (gameState === 'gameover') return;
      gameState = 'gameover';
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem(BEST_KEY, String(bestScore));
      }
      finalScoreEl.textContent = score;
      finalBestEl.textContent = bestScore;
      gameOverOverlay.classList.remove('hidden');
      gameOverOverlay.classList.add('flex');
      triggerGameOverSound();
    }

    startBtn.addEventListener('click', startGame);
    playAgainBtn.addEventListener('click', startGame);

    function spawnEnemyWave() {
      const count = Math.random() < 0.35 ? 2 : 1;
      for (let i = 0; i < count; i++) {
        const isBomb = Math.random() < 0.18;
        const margin = 52;
        const x = margin + Math.random() * Math.max(60, width - margin * 2);
        const y = -45;
        const style = STICK_ENEMY_STYLES[Math.floor(Math.random() * STICK_ENEMY_STYLES.length)];

        enemies.push({
          type: isBomb ? 'bomb' : 'enemy',
          x,
          y,
          vx: (Math.random() - 0.5) * 75,
          vy: 145 + Math.min(score * 3.5, 220) + Math.random() * 55,
          radius: 28,
          wobblePhase: Math.random() * Math.PI * 2,
          style,
          sliced: false
        });
      }
    }

    function createSlicedStickman(ent, swipeAngle) {
      // Head flying off + separated limb sticks (like in the video)
      slicedStickParts.push({
        kind: 'head',
        x: ent.x,
        y: ent.y - 16,
        vx: (Math.random() - 0.5) * 260,
        vy: -190 - Math.random() * 90,
        rot: 0,
        vRot: (Math.random() - 0.5) * 14,
        alpha: 1,
        style: ent.style
      });

      const limbColors = [ent.style.outline, '#fde047', '#f472b6', '#ffffff'];
      for (let i = 0; i < 4; i++) {
        const angle = swipeAngle + (i - 1.5) * 0.65;
        const speed = 130 + Math.random() * 140;
        slicedStickParts.push({
          kind: 'limb',
          x: ent.x + (Math.random() - 0.5) * 16,
          y: ent.y + (Math.random() - 0.5) * 18,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 80,
          rot: Math.random() * Math.PI,
          vRot: (Math.random() - 0.5) * 16,
          alpha: 1,
          color: limbColors[i % limbColors.length]
        });
      }

      const word = HIT_ONOMA[Math.floor(Math.random() * HIT_ONOMA.length)];
      floatingTexts.push({
        x: ent.x,
        y: ent.y - 28,
        text: word,
        sub: '+3',
        vy: -55,
        alpha: 1
      });
    }

    function distToSegmentSq(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const lenSq = dx * dx + dy * dy;
      if (lenSq === 0) {
        const ex = px - x1;
        const ey = py - y1;
        return ex * ex + ey * ey;
      }
      let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));
      const projX = x1 + t * dx;
      const projY = y1 + t * dy;
      const distX = px - projX;
      const distY = py - projY;
      return distX * distX + distY * distY;
    }

    let isPointerDown = false;

    function handleSwipeSegment(x1, y1, x2, y2) {
      if (gameState !== 'playing') return;

      player.targetX = x2;
      player.targetY = Math.max(110, Math.min(height - 90, y2));
      if (Math.abs(x2 - x1) > 2) {
        player.facing = x2 >= x1 ? 1 : -1;
      }

      const swipeAngle = Math.atan2(y2 - y1, x2 - x1);

      for (let i = enemies.length - 1; i >= 0; i--) {
        const ent = enemies[i];
        if (ent.sliced) continue;
        const hitRadius = ent.radius + 14;
        const dSq = distToSegmentSq(ent.x, ent.y, x1, y1, x2, y2);

        if (dSq <= hitRadius * hitRadius) {
          ent.sliced = true;
          player.slashAnim = 1;
          player.slashAngle = swipeAngle;

          if (ent.type === 'enemy') {
            score += 3;
            if (score > bestScore) {
              bestScore = score;
              localStorage.setItem(BEST_KEY, String(bestScore));
            }
            updateHud();
            createSlicedStickman(ent, swipeAngle);
            triggerKillSound();
            enemies.splice(i, 1);
          } else {
            // Bomb hit
            lives -= 1;
            screenShake = 18;
            flashAlpha = 0.5;
            updateHud();
            triggerBombSound();
            enemies.splice(i, 1);
            if (lives <= 0) {
              endGame();
            }
          }
        }
      }
    }

    function addTrailPoint(x, y) {
      const now = performance.now();
      const prev = trailPoints[trailPoints.length - 1];
      trailPoints.push({ x, y, t: now });
      if (trailPoints.length > 20) {
        trailPoints.shift();
      }
      if (prev) {
        handleSwipeSegment(prev.x, prev.y, x, y);
      }
    }

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      getAudioCtx();
      isPointerDown = true;
      canvas.setPointerCapture(e.pointerId);
      const pos = getCanvasPos(e);
      trailPoints.push({ x: pos.x, y: pos.y, t: performance.now() });
      if (gameState === 'playing') {
        player.targetX = pos.x;
        player.targetY = Math.max(110, Math.min(height - 90, pos.y));
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      e.preventDefault();
      const pos = getCanvasPos(e);
      addTrailPoint(pos.x, pos.y);
    });

    function releasePointer(e) {
      isPointerDown = false;
      if (e && canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) {
        try {
          canvas.releasePointerCapture(e.pointerId);
        } catch (_) {}
      }
    }

    canvas.addEventListener('pointerup', releasePointer);
    canvas.addEventListener('pointercancel', releasePointer);

    // Draw Dojo Wooden Plank Background + Hanging Paper Lanterns (matching original game)
    function drawDojoBackground(now) {
      ctx.fillStyle = '#3d1f10';
      ctx.fillRect(0, 0, width, height);

      // Vertical wooden planks
      const plankWidth = Math.max(54, Math.floor(width / 6));
      for (let x = 0; x < width; x += plankWidth) {
        const idx = Math.floor(x / plankWidth);
        ctx.fillStyle = idx % 2 === 0 ? '#452312' : '#3a1d0f';
        ctx.fillRect(x, 0, plankWidth, height);

        // Plank seam line
        ctx.strokeStyle = 'rgba(20, 9, 4, 0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }

      // Vignette shading
      const vig = ctx.createRadialGradient(
        width * 0.5,
        height * 0.5,
        width * 0.15,
        width * 0.5,
        height * 0.5,
        Math.max(width, height) * 0.75
      );
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(15, 7, 3, 0.55)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, width, height);

      // Two glowing orange dojo lanterns on left and right
      const lanternPositions = [width * 0.16, width * 0.84];
      const lanternY = Math.min(210, height * 0.25);

      lanternPositions.forEach((lx, i) => {
        const sway = Math.sin(now * 0.002 + i) * 3;
        ctx.save();
        ctx.translate(lx + sway, lanternY);

        // Hanging string
        ctx.strokeStyle = '#1c0d06';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -lanternY);
        ctx.lineTo(0, -24);
        ctx.stroke();

        // Warm radial glow
        const glow = ctx.createRadialGradient(0, 0, 6, 0, 0, 68);
        glow.addColorStop(0, 'rgba(251, 146, 60, 0.42)');
        glow.addColorStop(1, 'rgba(251, 146, 60, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, 68, 0, Math.PI * 2);
        ctx.fill();

        // Lantern body
        ctx.fillStyle = '#ea580c';
        ctx.beginPath();
        ctx.ellipse(0, 0, 16, 22, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#9a3412';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Top & bottom caps
        ctx.fillStyle = '#1c0d06';
        ctx.fillRect(-10, -24, 20, 4);
        ctx.fillRect(-10, 20, 20, 4);

        ctx.restore();
      });

      // Floating sakura petals
      ctx.fillStyle = 'rgba(251, 207, 232, 0.55)';
      for (const p of petals) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Draw Hero White Stickman Ninja with Red Headband & Katana (exact look from video)
    function drawHeroNinja(now) {
      ctx.save();
      ctx.translate(player.x, player.y);

      const bob = Math.sin(now * 0.008) * 2.5;

      // Ground shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.beginPath();
      ctx.ellipse(0, 34, 18, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Stickman white limbs & torso
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Torso
      ctx.beginPath();
      ctx.moveTo(0, -6 + bob);
      ctx.lineTo(0, 14 + bob);
      ctx.stroke();

      // Legs
      ctx.beginPath();
      ctx.moveTo(0, 14 + bob);
      ctx.lineTo(-10, 31);
      ctx.moveTo(0, 14 + bob);
      ctx.lineTo(10, 31);
      ctx.stroke();

      // Arms
      ctx.beginPath();
      ctx.moveTo(-14, 4 + bob);
      ctx.lineTo(0, 0 + bob);
      ctx.lineTo(15, 2 + bob);
      ctx.stroke();

      // Katana sword
      ctx.save();
      ctx.translate(14 * player.facing, 2 + bob);
      const baseAngle = player.facing > 0 ? -0.55 : Math.PI + 0.55;
      const swingOffset = player.slashAnim > 0 ? Math.sin(player.slashAnim * Math.PI) * 1.4 * player.facing : 0;
      ctx.rotate(baseAngle + swingOffset);

      // Blade
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(34, 0);
      ctx.stroke();

      // Hilt
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(-7, 0);
      ctx.lineTo(2, 0);
      ctx.stroke();
      ctx.restore();

      // Head circle
      ctx.fillStyle = '#f8fafc';
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -18 + bob, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Red Ninja Headband + flying tails
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(-13, -24 + bob, 26, 5.5);

      const tailWave = Math.sin(now * 0.015) * 3;
      ctx.beginPath();
      ctx.moveTo(-13 * player.facing, -21 + bob);
      ctx.lineTo(-27 * player.facing, -24 + bob + tailWave);
      ctx.lineTo(-25 * player.facing, -18 + bob + tailWave);
      ctx.closePath();
      ctx.fill();

      // Cartoon eyes
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(-4.5, -16 + bob, 2, 0, Math.PI * 2);
      ctx.arc(4.5, -16 + bob, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // Draw Enemy Cartoon Stickman (matching video's colorful outlined stickmen with funny faces)
    function drawEnemyStickman(ent, now) {
      ctx.save();
      ctx.translate(ent.x, ent.y);

      const s = ent.style;
      const legSwing = Math.sin(now * 0.012 + ent.wobblePhase) * 5;

      // Colored outer glow outline + inner white stick body
      function strokeStick(color, lw) {
        ctx.strokeStyle = color;
        ctx.lineWidth = lw;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Torso
        ctx.beginPath();
        ctx.moveTo(0, -4);
        ctx.lineTo(0, 14);
        ctx.stroke();

        // Legs
        ctx.beginPath();
        ctx.moveTo(0, 14);
        ctx.lineTo(-9 + legSwing, 28);
        ctx.moveTo(0, 14);
        ctx.lineTo(9 - legSwing, 28);
        ctx.stroke();

        // Arms
        ctx.beginPath();
        ctx.moveTo(-13, 2 - legSwing * 0.5);
        ctx.lineTo(0, 1);
        ctx.lineTo(13, 2 + legSwing * 0.5);
        ctx.stroke();
      }

      strokeStick(s.outline, 7);
      strokeStick('#ffffff', 3.2);

      // Head
      ctx.fillStyle = s.skin;
      ctx.strokeStyle = s.outline;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, -16, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Headband
      ctx.fillStyle = s.band;
      ctx.fillRect(-12, -23, 24, 4.5);

      // Funny cartoon glasses / face
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1.8;
      ctx.strokeRect(-8, -18, 6.5, 5);
      ctx.strokeRect(1.5, -18, 6.5, 5);
      ctx.beginPath();
      ctx.moveTo(-1.5, -15.5);
      ctx.lineTo(1.5, -15.5);
      ctx.stroke();

      // Pupils
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(-4.8, -15.5, 1.3, 0, Math.PI * 2);
      ctx.arc(4.8, -15.5, 1.3, 0, Math.PI * 2);
      ctx.fill();

      // Smirk / mouth
      ctx.beginPath();
      ctx.arc(0, -10.5, 4, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    function drawBomb(ent, now) {
      ctx.save();
      ctx.translate(ent.x, ent.y);

      // Fuse
      ctx.strokeStyle = '#e7e5e4';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.quadraticCurveTo(8, -30, 13, -26);
      ctx.stroke();

      // Spark
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(13, -26, 4.5 + Math.sin(now * 0.03) * 1.5, 0, Math.PI * 2);
      ctx.fill();

      // Bomb circle
      ctx.fillStyle = '#18181b';
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, 21, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Red X
      ctx.strokeStyle = '#f87171';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-7, -7);
      ctx.lineTo(7, 7);
      ctx.moveTo(7, -7);
      ctx.lineTo(-7, 7);
      ctx.stroke();

      ctx.restore();
    }

    function drawSlicedParts() {
      for (const p of slicedStickParts) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);

        if (p.kind === 'head') {
          ctx.fillStyle = p.style.skin;
          ctx.strokeStyle = p.style.outline;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(0, 0, 12, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = p.style.band;
          ctx.fillRect(-11, -6, 22, 4);
        } else {
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 4.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(-11, 0);
          ctx.lineTo(11, 0);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    function drawFloatingTexts() {
      for (const ft of floatingTexts) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.font = '900 22px Bangers, cursive';
        ctx.textAlign = 'center';
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#1c0d06';
        ctx.strokeText(ft.text, ft.x, ft.y);
        ctx.fillStyle = '#fb923c';
        ctx.fillText(ft.text, ft.x, ft.y);

        ctx.font = '800 14px Inter, sans-serif';
        ctx.strokeText(ft.sub, ft.x, ft.y + 18);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(ft.sub, ft.x, ft.y + 18);
        ctx.restore();
      }
    }

    function drawBladeTrail(now) {
      while (trailPoints.length > 0 && now - trailPoints[0].t > 125) {
        trailPoints.shift();
      }
      if (trailPoints.length < 2) return;

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (let i = 1; i < trailPoints.length; i++) {
        const p0 = trailPoints[i - 1];
        const p1 = trailPoints[i];
        const ratio = i / trailPoints.length;
        ctx.strokeStyle = `rgba(255, 255, 255, ${ratio * 0.92})`;
        ctx.lineWidth = Math.max(2, ratio * 9);
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    let lastTime = performance.now();

    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      // Update petals
      for (const p of petals) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vRot * dt;
        if (p.y > height + 10) {
          p.y = -10;
          p.x = Math.random() * width;
        }
      }

      ctx.save();
      if (screenShake > 0.2) {
        const sx = (Math.random() - 0.5) * screenShake;
        const sy = (Math.random() - 0.5) * screenShake;
        ctx.translate(sx, sy);
        screenShake *= 0.86;
      } else {
        screenShake = 0;
      }

      drawDojoBackground(now);

      if (gameState === 'playing') {
        // Smoothly move hero stickman ninja toward swipe
        player.x += (player.targetX - player.x) * Math.min(1, dt * 14);
        player.y += (player.targetY - player.y) * Math.min(1, dt * 14);
        if (player.slashAnim > 0) {
          player.slashAnim = Math.max(0, player.slashAnim - dt * 5.5);
        }

        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnEnemyWave();
          const minInterval = 0.55;
          const baseInterval = Math.max(minInterval, 1.25 - score * 0.008);
          spawnTimer = baseInterval * (0.75 + Math.random() * 0.45);
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
          const ent = enemies[i];
          ent.x += ent.vx * dt;
          ent.y += ent.vy * dt;

          // Keep within horizontal walls
          if (ent.x < 36) {
            ent.x = 36;
            ent.vx = Math.abs(ent.vx);
          } else if (ent.x > width - 36) {
            ent.x = width - 36;
            ent.vx = -Math.abs(ent.vx);
          }

          if (ent.type === 'bomb') {
            drawBomb(ent, now);
          } else {
            drawEnemyStickman(ent, now);
          }

          // Enemy reaches bottom -> lose a heart
          if (ent.y > height + 32) {
            enemies.splice(i, 1);
            if (ent.type === 'enemy' && gameState === 'playing') {
              lives -= 1;
              screenShake = 10;
              updateHud();
              if (lives <= 0) {
                endGame();
              }
            }
          }
        }
      }

      // Update & draw sliced stickman parts
      for (let i = slicedStickParts.length - 1; i >= 0; i--) {
        const p = slicedStickParts[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 680 * dt;
        p.rot += p.vRot * dt;
        p.alpha -= dt * 1.35;
        if (p.alpha <= 0) {
          slicedStickParts.splice(i, 1);
        }
      }
      drawSlicedParts();

      // Update & draw floating comic words ("THOK!", "POOT!", "+3")
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy * dt;
        ft.alpha -= dt * 1.4;
        if (ft.alpha <= 0) {
          floatingTexts.splice(i, 1);
        }
      }
      drawFloatingTexts();

      if (gameState === 'playing') {
        drawHeroNinja(now);
      }

      drawBladeTrail(now);

      if (flashAlpha > 0.01) {
        ctx.fillStyle = `rgba(239, 68, 68, ${flashAlpha})`;
        ctx.fillRect(0, 0, width, height);
        flashAlpha *= 0.88;
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
